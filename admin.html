<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星火引力 - 运营管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-brand { color: #FF6B00; }
        .bg-brand { background-color: #FF6B00; }
        .bg-ink-blue { background-color: #0F172A; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased flex h-screen overflow-hidden">

    <!-- 登录遮罩层 -->
    <div id="loginScreen" class="fixed inset-0 bg-ink-blue flex items-center justify-center z-[999]">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 text-center">
            <div class="w-16 h-16 bg-brand rounded-full flex items-center justify-center text-3xl text-white font-bold mx-auto mb-6">星</div>
            <h2 class="text-2xl font-bold mb-2">星火引力后台</h2>
            <p class="text-gray-500 text-sm mb-6">请输入管理密码</p>
            <input type="password" id="loginPassword" class="w-full border border-gray-300 rounded-lg p-3 text-center mb-4 focus:ring-2 focus:ring-brand outline-none" placeholder="••••••••">
            <button onclick="handleLogin()" class="w-full bg-brand hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition">进入系统</button>
        </div>
    </div>

    <!-- 主体内容 -->
    <div id="mainApp" class="flex w-full h-full hidden">
        <!-- 左侧侧边栏 -->
        <aside class="w-64 bg-ink-blue text-white flex flex-col shadow-xl z-20">
            <div class="h-16 flex items-center px-6 border-b border-gray-800">
                <div class="w-8 h-8 bg-brand rounded-full flex items-center justify-center font-bold text-lg text-white mr-3">星</div>
                <span class="font-bold text-xl tracking-wider">星火引力</span>
            </div>
            <nav class="flex-1 py-6 space-y-2">
                <a href="#" id="nav-dashboard" onclick="switchTab('dashboard')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">数据仪表盘</a>
                <a href="#" id="nav-leads" onclick="switchTab('leads')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">对接线索池</a>
                <a href="#" id="nav-contacts" onclick="switchTab('contacts')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">客户通讯录</a>
                <a href="#" id="nav-resources" onclick="switchTab('resources')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">资源管理</a>
                <a href="#" id="nav-vips" onclick="switchTab('vips')" class="flex items-center px-6 py-3 bg-brand/10 text-brand border-r-4 border-brand font-medium transition">大客户管理</a>
            </nav>
            <div class="mt-auto p-6 border-t border-gray-800 text-xs text-gray-500 text-center">
                郑州普耀文化传媒<br>© 2026 星火引力
                <button onclick="logout()" class="mt-2 text-red-400 hover:text-red-300 block w-full text-center">退出登录</button>
            </div>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="flex-1 flex flex-col relative overflow-hidden bg-gray-50">
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
                <h2 id="pageTitle" class="text-lg font-bold text-gray-800">大客户管理</h2>
                <div class="flex items-center gap-4">
                    <a href="https://xinghuoyinli.de5.net" target="_blank" class="text-sm text-gray-500 hover:text-brand transition flex items-center gap-1.5 border-r border-gray-200 pr-4">返回前台</a>
                    <button onclick="refreshCurrentTab()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-1.5 px-4 rounded transition">刷新数据</button>
                </div>
            </header>

            <!-- 1. 仪表盘 -->
            <div id="tab-dashboard" class="hidden flex-1 p-8 overflow-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <p class="text-sm text-gray-500 mb-1">平台资源总数</p><h3 id="stat-resources" class="text-3xl font-bold text-gray-900">0</h3>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <p class="text-sm text-gray-500 mb-1">收到对接线索</p><h3 id="stat-leads" class="text-3xl font-bold text-brand">0</h3>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <p class="text-sm text-gray-500 mb-1">VIP置顶资源</p><h3 id="stat-vip" class="text-3xl font-bold text-yellow-600">0</h3>
                    </div>
                </div>
            </div>

            <!-- 2. 线索池 -->
            <div id="tab-leads" class="hidden flex-1 p-8 overflow-auto">
                <div class="mb-4 flex justify-between items-center">
                    <div><h3 class="text-xl font-bold text-gray-800">对接线索池</h3></div>
                    <button onclick="exportLeadsToExcel()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm transition">⬇ 导出 Excel</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-50 text-gray-500 text-sm border-b">
                            <th class="py-4 px-6 font-medium">目标资源</th><th class="py-4 px-6 font-medium">称呼</th><th class="py-4 px-6 font-medium">联系方式</th><th class="py-4 px-6 font-medium">地址</th><th class="py-4 px-6 font-medium">留言</th><th class="py-4 px-6 text-right">操作</th>
                        </tr></thead>
                        <tbody id="leadsTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 3. 客户通讯录 -->
            <div id="tab-contacts" class="hidden flex-1 p-8 overflow-auto">
                <div class="mb-4 flex justify-between items-center">
                    <div><h3 class="text-xl font-bold text-gray-800">客户通讯录</h3></div>
                    <button onclick="exportContacts()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm transition">⬇ 导出 Excel</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-50 text-gray-500 text-sm border-b">
                            <th class="py-4 px-6 font-medium">客户姓名</th><th class="py-4 px-6 font-medium">联系方式</th><th class="py-4 px-6 font-medium">意向资源</th><th class="py-4 px-6 font-medium">地址</th><th class="py-4 px-6 text-right">操作</th>
                        </tr></thead>
                        <tbody id="contactsTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 4. 资源管理 -->
            <div id="tab-resources" class="hidden flex-1 p-8 overflow-auto">
                <div id="batchActionBar" class="hidden mb-4 bg-blue-50 border border-blue-200 rounded-lg p-3 flex items-center justify-between">
                    <div class="text-sm text-blue-800 font-medium">已选中 <span id="selectedCount" class="font-bold text-lg">0</span> 项</div>
                    <div class="flex gap-3">
                        <button onclick="batchUpdateVip(true)" class="text-sm bg-brand text-white px-3 py-1.5 rounded hover:bg-brand-hover">设为置顶</button>
                        <button onclick="batchUpdateVip(false)" class="text-sm bg-gray-500 text-white px-3 py-1.5 rounded hover:bg-gray-600">取消置顶</button>
                        <button onclick="batchDelete()" class="text-sm bg-red-500 text-white px-3 py-1.5 rounded hover:bg-red-600">批量删除</button>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-50 text-gray-500 text-sm border-b">
                            <th class="py-4 px-4 w-12 text-center"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" class="w-4 h-4 cursor-pointer"></th>
                            <th class="py-4 px-4 font-medium">编码</th><th class="py-4 px-4 font-medium">资源名称</th><th class="py-4 px-4 font-medium">行业/地域</th><th class="py-4 px-4 font-medium">状态</th><th class="py-4 px-6 text-right">操作</th>
                        </tr></thead>
                        <tbody id="resourcesTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 5. 大客户管理 -->
            <div id="tab-vips" class="flex-1 p-8 overflow-auto">
                <div class="mb-6 flex justify-between items-center">
                    <div><h3 class="text-xl font-bold text-gray-800">大客户微官网列表</h3></div>
                    <button onclick="openVipModal()" class="bg-ink-blue hover:bg-gray-800 text-white px-4 py-2 rounded-lg text-sm transition">+ 发布大客户</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-50 text-gray-500 text-sm border-b"><th class="py-4 px-6 font-medium">预览图</th><th class="py-4 px-6 font-medium">公司名称</th><th class="py-4 px-6 font-medium">状态</th><th class="py-4 px-6 font-medium">访问量</th><th class="py-4 px-6 text-right">操作</th></tr></thead>
                        <tbody id="vipTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 大客户弹窗 -->
    <div id="vipModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden transform transition-all scale-95 opacity-0" id="vipModalContent">
            <div class="bg-ink-blue px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg">发布/编辑 大客户微官网</h3>
                <button onclick="closeVipModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6 max-h-[70vh] overflow-y-auto space-y-4">
                <input type="hidden" id="vipEditId">
                <div><label class="block text-sm font-medium mb-1">公司名称 / 标题</label><input type="text" id="vipTitle" class="w-full border p-2.5 rounded-lg"></div>

                <!-- 轮播大图上传 -->
                <div>
                    <label class="block text-sm font-medium mb-1">轮播大图 (推荐尺寸 1920x600)</label>
                    <div class="flex items-center gap-3 mt-1">
                        <input type="file" id="vipBannerFileInput" accept="image/*" class="hidden" onchange="handleBannerUpload(this)">
                        <button type="button" onclick="document.getElementById('vipBannerFileInput').click()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm transition">📁 选择图片上传</button>
                        <span id="vipBannerFileName" class="text-sm text-gray-500 truncate flex-1">未选择文件</span>
                    </div>
                    <img id="vipBannerPreview" src="" class="mt-3 w-full h-32 object-cover rounded-lg border hidden">
                    <input type="hidden" id="vipBannerUrl" value="">
                </div>

                <div><label class="block text-sm font-medium mb-1">宣传口号</label><input type="text" id="vipSlogan" class="w-full border p-2.5 rounded-lg"></div>
                <div><label class="block text-sm font-medium mb-1">企业实力介绍</label><textarea id="vipIntro" rows="4" class="w-full border p-2.5 rounded-lg"></textarea></div>

                <!-- 产品图集上传 -->
                <div>
                    <label class="block text-sm font-medium mb-1">产品图集 (多选)</label>
                    <div class="flex items-center gap-3 mt-1 mb-2">
                        <input type="file" id="vipGalleryFileInput" accept="image/*" multiple class="hidden" onchange="handleGalleryUpload(this)">
                        <button type="button" onclick="document.getElementById('vipGalleryFileInput').click()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm transition">📁 选择多张图片上传</button>
                        <span id="vipGalleryFileName" class="text-sm text-gray-500 truncate flex-1">支持一次性多选</span>
                    </div>
                    <textarea id="vipGallery" rows="2" class="w-full border p-2.5 rounded-lg text-xs" placeholder="上传后自动填入链接，用逗号分隔"></textarea>
                    <div id="vipGalleryPreview" class="mt-2 grid grid-cols-4 gap-2 hidden"></div>
                </div>

                <div><label class="block text-sm font-medium mb-1">合作案例 (逗号隔开)</label><textarea id="vipCases" rows="3" class="w-full border p-2.5 rounded-lg text-xs"></textarea></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">联系电话</label><input type="text" id="vipPhone" class="w-full border p-2.5 rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">微信号</label><input type="text" id="vipWechat" class="w-full border p-2.5 rounded-lg"></div>
                </div>
                <div><label class="block text-sm font-medium mb-1">外链 (官网/抖音)</label><input type="text" id="vipExtLink" class="w-full border p-2.5 rounded-lg text-xs"></div>

                               <!-- 🌟 可视化卡片主题选择 (5色填满版) -->
                <div>
                    <label class="block text-sm font-medium mb-2">微官网主题风格</label>
                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                        <!-- 星火橙 (品牌默认) -->
                        <label class="cursor-pointer">
                            <input type="radio" name="vipThemeRadio" value="orange" class="peer hidden">
                            <div class="rounded-xl h-14 flex items-center justify-center bg-[#FF6B00] text-white peer-checked:ring-4 peer-checked:ring-offset-2 peer-checked:ring-[#FF6B00] transition shadow-sm hover:opacity-90">
                                <span class="text-sm font-bold tracking-wider">星火橙</span>
                            </div>
                        </label>

                        <!-- 烟火暖色 -->
                        <label class="cursor-pointer">
                            <input type="radio" name="vipThemeRadio" value="warm" class="peer hidden" checked>
                            <div class="rounded-xl h-14 flex items-center justify-center bg-[#E60012] text-white peer-checked:ring-4 peer-checked:ring-offset-2 peer-checked:ring-[#E60012] transition shadow-sm hover:opacity-90">
                                <span class="text-sm font-bold tracking-wider">烟火暖色</span>
                            </div>
                        </label>

                        <!-- 经典商务 -->
                        <label class="cursor-pointer">
                            <input type="radio" name="vipThemeRadio" value="biz" class="peer hidden">
                            <div class="rounded-xl h-14 flex items-center justify-center bg-[#1E40AF] text-white peer-checked:ring-4 peer-checked:ring-offset-2 peer-checked:ring-[#1E40AF] transition shadow-sm hover:opacity-90">
                                <span class="text-sm font-bold tracking-wider">经典商务</span>
                            </div>
                        </label>

                        <!-- 极客深色 -->
                        <label class="cursor-pointer">
                            <input type="radio" name="vipThemeRadio" value="dark" class="peer hidden">
                            <div class="rounded-xl h-14 flex items-center justify-center bg-[#0F172A] text-white peer-checked:ring-4 peer-checked:ring-offset-2 peer-checked:ring-[#0F172A] transition shadow-sm hover:opacity-90">
                                <span class="text-sm font-bold tracking-wider">极客深色</span>
                            </div>
                        </label>

                        <!-- 自然清新 -->
                        <label class="cursor-pointer">
                            <input type="radio" name="vipThemeRadio" value="fresh" class="peer hidden">
                            <div class="rounded-xl h-14 flex items-center justify-center bg-[#10B981] text-white peer-checked:ring-4 peer-checked:ring-offset-2 peer-checked:ring-[#10B981] transition shadow-sm hover:opacity-90">
                                <span class="text-sm font-bold tracking-wider">自然清新</span>
                            </div>
                        </label>
                    </div>
                </div>

            </div>
            <div class="p-4 bg-gray-50 flex justify-end gap-3">
                <button onclick="closeVipModal()" class="px-4 py-2 bg-white border rounded-lg">取消</button>
                <button onclick="saveVip()" class="px-4 py-2 bg-brand text-white rounded-lg shadow-md">保存</button>
            </div>
        </div>
    </div>

    <!-- 线索编辑弹窗 -->
    <div id="leadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="bg-ink-blue px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg">编辑客户线索</h3>
                <button onclick="closeLeadModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="leadEditId">
                <div><label class="block text-sm font-medium mb-1">客户姓名</label><input type="text" id="leadEditName" class="w-full border p-2.5 rounded-lg"></div>
                <div><label class="block text-sm font-medium mb-1">联系方式</label><input type="text" id="leadEditContact" class="w-full border p-2.5 rounded-lg"></div>
                <div><label class="block text-sm font-medium mb-1">地址</label><input type="text" id="leadEditAddress" class="w-full border p-2.5 rounded-lg"></div>
                <div><label class="block text-sm font-medium mb-1">留言/备注</label><textarea id="leadEditMsg" rows="2" class="w-full border p-2.5 rounded-lg"></textarea></div>
            </div>
            <div class="p-4 bg-gray-50 flex justify-end gap-3">
                <button onclick="closeLeadModal()" class="px-4 py-2 bg-white border rounded-lg">取消</button>
                <button onclick="saveLead()" class="px-4 py-2 bg-brand text-white rounded-lg shadow-md">保存</button>
            </div>
        </div>
    </div>

    <!-- 资源编辑弹窗 -->
    <div id="resModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="bg-ink-blue px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg">编辑商业资源</h3>
                <button onclick="closeResModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="resEditId">
                <div><label class="block text-sm font-medium mb-1">资源名称</label><input type="text" id="resEditName" class="w-full border p-2.5 rounded-lg"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">行业</label><input type="text" id="resEditIndustry" class="w-full border p-2.5 rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">地域</label><input type="text" id="resEditRegion" class="w-full border p-2.5 rounded-lg"></div>
                </div>
                <div><label class="block text-sm font-medium mb-1">资源类型</label><input type="text" id="resEditType" class="w-full border p-2.5 rounded-lg"></div>
                <div><label class="block text-sm font-medium mb-1">详细描述</label><textarea id="resEditDesc" rows="3" class="w-full border p-2.5 rounded-lg"></textarea></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">联系人</label><input type="text" id="resEditContactName" class="w-full border p-2.5 rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">电话</label><input type="text" id="resEditContactPhone" class="w-full border p-2.5 rounded-lg"></div>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="resEditVip" class="w-4 h-4">
                    <label class="text-sm text-gray-700">开启VIP置顶</label>
                </div>
            </div>
            <div class="p-4 bg-gray-50 flex justify-end gap-3">
                <button onclick="closeResModal()" class="px-4 py-2 bg-white border rounded-lg">取消</button>
                <button onclick="saveResource()" class="px-4 py-2 bg-brand text-white rounded-lg shadow-md">保存</button>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'vips';
        let adminToken = localStorage.getItem('adminToken') || '';
        let selectedIds = new Set();
        let currentResources = [];
        let allLeadsData = [];

        const originalFetch = window.fetch;
        window.fetch = function() {
            let [resource, config] = arguments;
            if (typeof resource === 'string' && resource.includes('/api/')) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['Authorization'] = `Bearer ${adminToken}`;
            }
            return originalFetch.apply(this, arguments);
        };

        function handleLogin() {
            const pwd = document.getElementById('loginPassword').value;
            fetch('https://xinghuo-backend.fastapicloud.dev/api/admin/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd })
            }).then(res => { if (res.ok) return res.json(); throw new Error("密码错误"); }).then(data => {
                adminToken = data.token; localStorage.setItem('adminToken', adminToken);
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                switchTab('dashboard');
            }).catch(err => { alert(err.message); });
        }

        function logout() { localStorage.removeItem('adminToken'); window.location.reload(); }

        if (adminToken) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.addEventListener('DOMContentLoaded', () => switchTab('dashboard'));
        }

        function switchTab(tabId) {
            currentTab = tabId;
            ['dashboard','leads','contacts','resources','vips'].forEach(id => {
                document.getElementById('nav-'+id).className = "flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition";
                document.getElementById('tab-'+id).classList.add('hidden');
            });
            document.getElementById('nav-'+tabId).className = "flex items-center px-6 py-3 bg-brand/10 text-brand border-r-4 border-brand font-medium transition";
            document.getElementById('tab-'+tabId).classList.remove('hidden');
            const titles = { dashboard: '数据仪表盘', leads: '对接线索池', contacts: '客户通讯录', resources: '资源管理', vips: '大客户管理' };
            document.getElementById('pageTitle').innerText = titles[tabId];
            if (tabId === 'dashboard') fetchStats();
            if (tabId === 'leads' || tabId === 'contacts') fetchLeadsAndContacts();
            if (tabId === 'resources') fetchResources();
            if (tabId === 'vips') fetchVips();
        }

        // ==========================================
        async function uploadFileToR2(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('https://xinghuo-backend.fastapicloud.dev/api/admin/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.detail || '上传失败');
                }

                const data = await response.json();
                return data.url; // 返回蜜蜂图床生成的完整链接
            } catch (error) {
                console.error('上传出错:', error);
                throw error;
            }
        }

        async function handleBannerUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const fileNameEl = document.getElementById('vipBannerFileName');
            const previewEl = document.getElementById('vipBannerPreview');

            fileNameEl.innerText = '正在上传...';
            fileNameEl.className = 'text-sm text-brand truncate flex-1 animate-pulse';
            previewEl.src = URL.createObjectURL(file);
            previewEl.classList.remove('hidden');

            try {
                const publicUrl = await uploadFileToR2(file);
                document.getElementById('vipBannerUrl').value = publicUrl;
                fileNameEl.innerText = '✅ 上传成功';
                fileNameEl.className = 'text-sm text-green-600 truncate flex-1';
            } catch (error) {
                console.error('上传出错:', error);
                alert('图片上传失败：' + error.message);
                fileNameEl.innerText = '上传失败，请重试';
                fileNameEl.className = 'text-sm text-red-600 truncate flex-1';
                previewEl.classList.add('hidden');
                document.getElementById('vipBannerUrl').value = '';
            }
        }

        async function handleGalleryUpload(input) {
            const files = input.files;
            if (!files || files.length === 0) return;

            const fileNameEl = document.getElementById('vipGalleryFileName');
            const previewContainer = document.getElementById('vipGalleryPreview');
            const galleryTextarea = document.getElementById('vipGallery');

            fileNameEl.innerText = `正在上传 0/${files.length} 张...`;
            fileNameEl.className = 'text-sm text-brand truncate flex-1 animate-pulse';
            previewContainer.innerHTML = '';
            previewContainer.classList.remove('hidden');

            let uploadedUrls = [];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];

                // 显示本地预览
                previewContainer.innerHTML += `<img id="temp-prev-${i}" src="${URL.createObjectURL(file)}" class="w-full h-16 object-cover rounded border opacity-50">`;

                try {
                    const publicUrl = await uploadFileToR2(file);
                    uploadedUrls.push(publicUrl);

                    // 更新进度
                    fileNameEl.innerText = `正在上传 ${i+1}/${files.length} 张...`;

                    // 更新预览状态
                    const tempPrev = document.getElementById(`temp-prev-${i}`);
                    if (tempPrev) {
                        tempPrev.src = publicUrl;
                        tempPrev.classList.remove('opacity-50');
                    }
                } catch (error) {
                    console.error('单张图上传失败:', error);
                    fileNameEl.innerText = `部分图片上传失败`;
                }
            }

            if (uploadedUrls.length > 0) {
                // 将新上传的链接追加到文本框（用逗号分隔）
                let currentVal = galleryTextarea.value.trim();
                let newVal = uploadedUrls.join(',');
                galleryTextarea.value = currentVal ? `${currentVal},${newVal}` : newVal;

                fileNameEl.innerText = `✅ ${uploadedUrls.length} 张图上传完成`;
                fileNameEl.className = 'text-sm text-green-600 truncate flex-1';
            } else {
                fileNameEl.innerText = `上传失败`;
                fileNameEl.className = 'text-sm text-red-600 truncate flex-1';
            }
        }
    </script>
</body>
</html>
