<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天地之中 · 嵩山人文志 - 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Quill 富文本 -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: '#059669', brandHover: '#047857', inkBlue: '#0F172A' } } }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .ql-container { font-family: inherit; font-size: 14px; }
        .ql-editor { min-height: 200px; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased flex h-screen overflow-hidden">

    <div id="loginScreen" class="fixed inset-0 bg-inkBlue flex items-center justify-center z-[999]">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 text-center">
            <div class="w-16 h-16 bg-brand rounded-full flex items-center justify-center text-3xl text-white font-serif font-bold mx-auto mb-6">嵩</div>
            <h2 class="text-2xl font-bold mb-2">嵩山人文志后台</h2>
            <p class="text-gray-500 text-sm mb-6">请输入管理密码</p>
            <input type="password" id="loginPassword" class="w-full border border-gray-300 rounded-lg p-3 text-center mb-4 focus:ring-2 focus:ring-brand outline-none" placeholder="••••••••">
            <button onclick="handleLogin()" class="w-full bg-brand hover:bg-brandHover text-white font-bold py-3 rounded-lg transition">进入系统</button>
        </div>
    </div>

    <div id="mainApp" class="flex w-full h-full hidden">
        <aside class="w-64 bg-inkBlue text-white flex flex-col shadow-xl z-20">
            <div class="h-16 flex flex-col justify-center px-6 border-b border-gray-800">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-brand rounded-lg flex items-center justify-center font-serif font-bold text-lg text-white">嵩</div>
                    <span class="font-bold text-lg tracking-wider">嵩山人文志</span>
                </div>
                <span class="text-[10px] text-gray-400 tracking-widest mt-0.5 uppercase">Admin System</span>
            </div>
            <nav class="flex-1 py-6 space-y-2">
                <a href="#" id="nav-dashboard" onclick="switchTab('dashboard')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">数据仪表盘</a>
                <a href="#" id="nav-leads" onclick="switchTab('leads')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">定制行囊线索</a>
                <a href="#" id="nav-partners" onclick="switchTab('partners')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">主理人入驻申请</a>
                <a href="#" id="nav-resources" onclick="switchTab('resources')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">生态体验库管理</a>
                <a href="#" id="nav-events" onclick="switchTab('events')" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition">会议与讲座管理</a>
            </nav>
            <div class="mt-auto p-6 border-t border-gray-800 text-xs text-gray-500 text-center">
                河南嵩玉文化旅游有限公司<br>© 2026 天地之中
                <button onclick="logout()" class="mt-2 text-red-400 hover:text-red-300 block w-full text-center">退出登录</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative overflow-hidden bg-gray-50">
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
                <h2 id="pageTitle" class="text-lg font-bold text-gray-800">数据仪表盘</h2>
                <div class="flex items-center gap-4">
                    <a href="index.html" target="_blank" class="text-sm text-gray-500 hover:text-brand transition flex items-center gap-1.5 border-r border-gray-200 pr-4">返回前台</a>
                    <button onclick="refreshCurrentTab()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-1.5 px-4 rounded transition">刷新数据</button>
                </div>
            </header>

            <!-- 数据仪表盘 -->
            <div id="tab-dashboard" class="hidden flex-1 p-8 overflow-auto">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6"><p class="text-sm text-gray-500 mb-1">生态库总数</p><h3 id="stat-resources" class="text-3xl font-bold text-gray-900">0</h3></div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6"><p class="text-sm text-gray-500 mb-1">游客留资</p><h3 id="stat-leads" class="text-3xl font-bold text-blue-600">0</h3></div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6"><p class="text-sm text-gray-500 mb-1">主理人申请</p><h3 id="stat-partners" class="text-3xl font-bold text-brand">0</h3></div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6"><p class="text-sm text-gray-500 mb-1">会议讲座</p><h3 id="stat-events" class="text-3xl font-bold text-amber-600">0</h3></div>
                </div>
            </div>

            <!-- 定制行囊线索 -->
            <div id="tab-leads" class="hidden flex-1 p-8 overflow-auto">
                <div class="mb-4 flex justify-between items-center">
                    <h3 class="text-xl font-bold text-gray-800">游客定制留资池</h3>
                    <div class="flex items-center gap-4">
                        <!-- 筛选 Tab -->
                        <div class="flex bg-gray-100 rounded-lg p-1 text-sm border border-gray-200">
                            <button onclick="filterLeads('all')" id="tab-lead-all" class="px-3 py-1 rounded-md bg-white shadow-sm font-medium transition text-gray-800">全部</button>
                            <button onclick="filterLeads('pending')" id="tab-lead-pending" class="px-3 py-1 rounded-md text-gray-500 hover:text-gray-700 transition">待响应</button>
                            <button onclick="filterLeads('responded')" id="tab-lead-responded" class="px-3 py-1 rounded-md text-gray-500 hover:text-gray-700 transition">已响应</button>
                        </div>
                        <button onclick="exportTableToCSV('leadsTable', '游客留资')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm transition">⬇ 导出 Excel</button>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table id="leadsTable" class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-sm border-b">
                                <th class="py-4 px-6 font-medium">主题</th>
                                <th class="py-4 px-6 font-medium w-1/3">备注</th>
                                <th class="py-4 px-6 text-center font-medium">状态</th>
                                <th class="py-4 px-6 text-right font-medium">时间</th>
                                <th class="py-4 px-6 text-center font-medium">操作</th>
                            </tr>
                        </thead>
                        <tbody id="leadsTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 主理人入驻 -->
            <div id="tab-partners" class="hidden flex-1 p-8 overflow-auto">
                <div class="mb-4 flex justify-between items-center">
                    <h3 class="text-xl font-bold text-gray-800">主理人入驻申请</h3>
                    <button onclick="exportTableToCSV('partnersTable', '主理人入驻')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm transition">⬇ 导出 Excel</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table id="partnersTable" class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-50 text-gray-500 text-sm border-b"><th class="py-4 px-6 font-medium">商家名称</th><th class="py-4 px-6 font-medium">业态</th><th class="py-4 px-6 font-medium">联系方式</th><th class="py-4 px-6 font-medium">介绍</th><th class="py-4 px-6 text-right font-medium">时间</th></tr></thead>
                        <tbody id="partnersTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 生态库管理 -->
            <div id="tab-resources" class="hidden flex-1 p-8 overflow-auto">
                <div class="mb-6 flex justify-between items-center">
                    <h3 class="text-xl font-bold text-gray-800">生态体验库列表</h3>
                    <button onclick="openResModal()" class="bg-brand hover:bg-brandHover text-white px-4 py-2 rounded-lg text-sm transition">+ 发布新内容</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-50 text-gray-500 text-sm border-b"><th class="py-4 px-4 w-16 text-center font-medium">封面</th><th class="py-4 px-4 font-medium">分类</th><th class="py-4 px-4 font-medium">标题</th><th class="py-4 px-4 font-medium">价格</th><th class="py-4 px-6 text-right font-medium">操作</th></tr></thead>
                        <tbody id="resourcesTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 会议管理 -->
            <div id="tab-events" class="hidden flex-1 p-8 overflow-auto">
                <div class="mb-6 flex justify-between items-center">
                    <h3 class="text-xl font-bold text-gray-800">会议与讲座列表</h3>
                    <button onclick="openEventModal()" class="bg-brand hover:bg-brandHover text-white px-4 py-2 rounded-lg text-sm transition">+ 发布新会议</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-gray-50 text-gray-500 text-sm border-b"><th class="py-4 px-6 font-medium">日期</th><th class="py-4 px-6 font-medium">标题</th><th class="py-4 px-6 font-medium">地点</th><th class="py-4 px-6 text-right font-medium">操作</th></tr></thead>
                        <tbody id="eventsTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 生态资源弹窗 -->
    <div id="resModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden">
            <div class="bg-inkBlue px-6 py-4 flex justify-between items-center text-white">
                <h3 id="resModalTitle" class="font-bold text-lg">发布生态内容</h3>
                <button onclick="closeResModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6 max-h-[70vh] overflow-y-auto space-y-4">
                <input type="hidden" id="resEditId">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">分类</label><select id="resEditCategory" class="w-full border p-2.5 rounded-lg bg-white"><option value="文化">文化图书</option><option value="礼物">嵩山礼物</option><option value="非遗">非遗体验</option><option value="自然">自然徒步</option><option value="住宿">住宿（民宿/酒店）</option><option value="餐饮">餐饮（饭店/素斋）</option><option value="交通">交通出行（租车/包车）</option><option value="商业">其他商业服务</option></select></div>
                    <div><label class="block text-sm font-medium mb-1">标签</label><input type="text" id="resEditTag" class="w-full border p-2.5 rounded-lg"></div>
                </div>
                <div><label class="block text-sm font-medium mb-1">标题</label><input type="text" id="resEditTitle" class="w-full border p-2.5 rounded-lg"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">规格/时长</label><input type="text" id="resEditDuration" class="w-full border p-2.5 rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">参考价格</label><input type="number" id="resEditPrice" class="w-full border p-2.5 rounded-lg"></div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">封面图片</label>
                    <div class="flex items-center gap-3 mt-1">
                        <input type="file" id="resImgFileInput" accept="image/*" class="hidden" onchange="handleResImgUpload(this)">
                        <button type="button" onclick="document.getElementById('resImgFileInput').click()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm transition">📁 选择图片</button>
                        <span id="resImgFileName" class="text-sm text-gray-500 truncate flex-1">未选择文件</span>
                    </div>
                    <img id="resImgPreview" src="" class="mt-3 w-full h-32 object-cover rounded-lg border hidden">
                    <input type="hidden" id="resEditImg" value="">
                </div>
                <div><label class="block text-sm font-medium mb-1">简介</label><textarea id="resEditDesc" rows="3" class="w-full border p-2.5 rounded-lg"></textarea></div>
                <div><label class="block text-sm font-medium mb-1">关键词</label><input type="text" id="resEditKeywords" class="w-full border p-2.5 rounded-lg"></div>
            </div>
            <div class="p-4 bg-gray-50 flex justify-end gap-3">
                <button onclick="closeResModal()" class="px-4 py-2 bg-white border rounded-lg">取消</button>
                <button onclick="saveResource()" class="px-4 py-2 bg-brand text-white rounded-lg shadow-md">保存</button>
            </div>
        </div>
    </div>

    <!-- 会议编辑弹窗 -->
    <div id="eventModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden">
            <div class="bg-inkBlue px-6 py-4 flex justify-between items-center text-white">
                <h3 id="eventModalTitle" class="font-bold text-lg">发布会议</h3>
                <button onclick="closeEventModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6 max-h-[75vh] overflow-y-auto space-y-4">
                <input type="hidden" id="eventEditId">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">会议标题</label><input type="text" id="eventTitle" class="w-full border p-2.5 rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">日期</label><input type="text" id="eventDate" class="w-full border p-2.5 rounded-lg" placeholder="2026年6月23日"></div>
                </div>
                <div><label class="block text-sm font-medium mb-1">地点</label><input type="text" id="eventLocation" class="w-full border p-2.5 rounded-lg" placeholder="河南 · 登封"></div>
                <div><label class="block text-sm font-medium mb-1">摘要</label><textarea id="eventSummary" rows="2" class="w-full border p-2.5 rounded-lg"></textarea></div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">正文内容 (可视化编辑)</label>
                    <div id="eventEditor" class="h-64 bg-white border border-gray-200 rounded-lg"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">媒体报道链接 (选填)</label>
                    <p class="text-xs text-gray-400 mb-1">格式：报道标题|链接URL，多个请用回车换行。</p>
                    <textarea id="eventMediaLinks" rows="2" class="w-full border p-2.5 rounded-lg font-mono text-sm bg-gray-50"></textarea>
                </div>

                <div class="border border-gray-200 rounded-lg p-4 bg-gray-50">
                    <label class="block text-sm font-bold text-gray-700 mb-2">正文配图 / 图集</label>
                    <div class="flex items-center gap-3 mb-3">
                        <input type="file" id="eventImgsFileInput" accept="image/*" multiple class="hidden" onchange="handleEventImgsUpload(this)">
                        <button type="button" onclick="document.getElementById('eventImgsFileInput').click()" class="bg-brand hover:bg-brandHover text-white px-4 py-2 rounded-lg text-sm transition shadow-sm">📁 选择多张图片上传</button>
                        <span id="eventImgsUploadStatus" class="text-sm text-gray-500 truncate flex-1"></span>
                    </div>
                    <div id="eventImagesPreview" class="grid grid-cols-4 gap-3 mt-2"></div>
                </div>
            </div>
            <div class="p-4 bg-gray-50 flex justify-end gap-3 border-t">
                <button onclick="closeEventModal()" class="px-4 py-2 bg-white border rounded-lg">取消</button>
                <button onclick="saveEvent()" class="px-4 py-2 bg-brand text-white rounded-lg shadow-md">保存发布</button>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'dashboard';
        let adminToken = localStorage.getItem('adminToken') || '';
        let currentEventImagesArray = [];
        const API_BASE = 'https://songshan-backend.fastapicloud.dev';

        // 🌟 线索模块全局变量
        let currentLeadFilter = 'all';
        let allGuestLeads = [];
        let allPartnerLeads = [];

        // Quill 编辑器
        const quill = new Quill('#eventEditor', {
            theme: 'snow',
            placeholder: '在此输入正文，支持加粗、标题、列表等排版...',
            modules: { toolbar: [[{ 'header': [2, 3, false] }], ['bold', 'italic', 'underline', 'strike'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['link', 'image'], ['clean']] }
        });

        // 格式化时间
        function formatTime(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const pad = (n) => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            } catch (e) {
                return dateStr;
            }
        }

        const originalFetch = window.fetch;
        window.fetch = function() {
            let [resource, config] = arguments;
            if (typeof resource === 'string' && resource.includes('/api/')) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['Authorization'] = `Bearer ${adminToken}`;
            }
            return originalFetch.apply(this, arguments);
        };

        function handleLogin() {
            const pwd = document.getElementById('loginPassword').value;
            fetch(`${API_BASE}/api/admin/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd })
            }).then(res => { if (res.ok) return res.json(); throw new Error("密码错误"); }).then(data => {
                adminToken = data.token; localStorage.setItem('adminToken', adminToken);
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');

                // 检查 URL 参数并跳转
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('lead_id')) {
                    switchTab('leads');
                } else {
                    switchTab('dashboard');
                }
            }).catch(err => { alert(err.message); });
        }

        function logout() { localStorage.removeItem('adminToken'); window.location.reload(); }

        if (adminToken) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.addEventListener('DOMContentLoaded', () => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('lead_id')) {
                    switchTab('leads');
                } else {
                    switchTab('dashboard');
                }
            });
        }

        function switchTab(tabId) {
            // 如果切到 leads，重置筛选为全部
            if (tabId === 'leads' && currentTab !== 'leads') {
                filterLeads('all');
            }

            currentTab = tabId;
            ['dashboard','leads','partners','resources','events'].forEach(id => {
                const nav = document.getElementById('nav-'+id);
                if(nav) nav.className = "flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-white/5 transition";
                const tab = document.getElementById('tab-'+id);
                if(tab) tab.classList.add('hidden');
            });
            document.getElementById('nav-'+tabId).className = "flex items-center px-6 py-3 bg-brand/10 text-brand border-r-4 border-brand font-medium transition";
            document.getElementById('tab-'+tabId).classList.remove('hidden');
            const titles = { dashboard: '数据仪表盘', leads: '定制行囊线索', partners: '主理人入驻申请', resources: '生态体验库管理', events: '会议与讲座管理' };
            document.getElementById('pageTitle').innerText = titles[tabId];

            if (tabId === 'dashboard') fetchStats();
            if (tabId === 'leads' || tabId === 'partners') fetchLeads();
            if (tabId === 'resources') fetchResources();
            if (tabId === 'events') fetchEvents();
        }

        function refreshCurrentTab() { switchTab(currentTab); }

        async function fetchStats() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/stats`);
                const data = await response.json();
                document.getElementById('stat-resources').innerText = data.total_resources || 0;
                document.getElementById('stat-leads').innerText = data.total_leads || 0;
                document.getElementById('stat-partners').innerText = data.total_leads || 0;
                document.getElementById('stat-events').innerText = data.total_events || 0;
            } catch (error) { console.error(error); }
        }

        async function fetchLeads() {
            try {
                const res = await fetch(`${API_BASE}/api/leads`);
                const data = await res.json();

                // 分流
                allGuestLeads = data.leads.filter(l => l.resource_name !== '主理人入驻申请');
                allPartnerLeads = data.leads.filter(l => l.resource_name === '主理人入驻申请');

                const urlParams = new URLSearchParams(window.location.search);
                const targetLeadId = urlParams.get('lead_id');

                renderGuestLeads(targetLeadId);
                renderPartnerLeads();
            } catch(e) { console.error(e); }
        }

        // 渲染定制行囊线索
        function renderGuestLeads(highlightId = null) {
            const tbody = document.getElementById('leadsTableBody');
            if (!tbody) return;

            const filteredData = allGuestLeads.filter(lead => {
                const status = lead.status || 'pending';
                if (currentLeadFilter === 'all') return true;
                return status === currentLeadFilter;
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="py-10 text-center text-gray-400">暂无游客留资</td></tr>';
                return;
            }

            tbody.innerHTML = filteredData.map(l => {
                const isPending = (l.status || 'pending') === 'pending';
                const isHighlight = highlightId && l.id.toString() === highlightId;

                let trClass = "hover:bg-gray-50 transition-colors";
                let trAttr = "";
                if (isHighlight) {
                    trClass = "bg-yellow-50 hover:bg-yellow-100 transition-colors border-l-4 border-yellow-400";
                    trAttr = `id="highlighted-lead-${l.id}"`;
                }

                return `<tr class="${trClass}" ${trAttr}>
                    <td class="py-4 px-6 font-bold text-brand">${l.resource_name || '定制行囊'}</td>
                    <td class="py-4 px-6 text-gray-500 max-w-md truncate" title="${l.message || '-'}">${l.message || '-'}</td>

                    <td class="py-4 px-6 text-center">
                        ${isPending
                            ? '<span class="px-2.5 py-1 bg-yellow-100 text-yellow-700 rounded-md text-xs font-medium">待响应</span>'
                            : '<span class="px-2.5 py-1 bg-green-100 text-green-700 rounded-md text-xs font-medium">已响应</span>'}
                    </td>

                    <td class="py-4 px-6 text-right text-gray-400 text-xs whitespace-nowrap">${formatTime(l.created_at)}</td>

                    <td class="py-4 px-6 text-center">
                        <button onclick="markResponded(${l.id})"
                                class="px-3 py-1.5 rounded text-xs font-medium transition-colors ${isPending ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-sm' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}"
                                ${!isPending ? 'disabled' : ''}>
                            ${isPending ? '标记已响应' : '已处理'}
                        </button>
                    </td>
                </tr>`;
            }).join('');

            // 滚动到高亮行
            if (highlightId) {
                setTimeout(() => {
                    const el = document.getElementById(`highlighted-lead-${highlightId}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            }
        }

        // 渲染主理人申请
        function renderPartnerLeads() {
            const tbody = document.getElementById('partnersTableBody');
            if (!tbody) return;

            tbody.innerHTML = allPartnerLeads.length === 0 ? '<tr><td colspan="5" class="py-10 text-center text-gray-400">暂无商家申请</td></tr>' :
                allPartnerLeads.map(l => {
                    const nameMatch = l.message.match(/【商家名称】：(.*?)(\n|$)/);
                    const typeMatch = l.message.match(/【业态类型】：(.*?)(\n|$)/);
                    const phoneMatch = l.message.match(/【联系电话】：(.*?)(\n|$)/);
                    const introMatch = l.message.match(/【介绍】：(.*?)(\n|$)/);
                    return `<tr class="hover:bg-gray-50"><td class="py-4 px-6 font-bold text-gray-800">${nameMatch ? nameMatch[1] : '未知'}</td><td class="py-4 px-6 text-xs"><span class="bg-brand/10 text-brand px-2 py-1 rounded">${typeMatch ? typeMatch[1] : '-'}</span></td><td class="py-4 px-6 font-mono text-brand font-bold">${phoneMatch ? phoneMatch[1] : '-'}</td><td class="py-4 px-6 text-gray-500 text-xs max-w-xs truncate">${introMatch ? introMatch[1] : '-'}</td>
                    <td class="py-4 px-6 text-right text-gray-400 text-xs">${formatTime(l.created_at)}</td></tr>`;
                }).join('');
        }

        // 切换线索筛选状态
        function filterLeads(status) {
            currentLeadFilter = status;

            const tabs = {
                all: document.getElementById('tab-lead-all'),
                pending: document.getElementById('tab-lead-pending'),
                responded: document.getElementById('tab-lead-responded')
            };

            const activeClass = 'px-3 py-1 rounded-md bg-white shadow-sm font-medium transition text-gray-800';
            const inactiveClass = 'px-3 py-1 rounded-md text-gray-500 hover:text-gray-700 transition';

            Object.keys(tabs).forEach(key => {
                if(tabs[key]) tabs[key].className = (key === status) ? activeClass : inactiveClass;
            });

            renderGuestLeads();
        }

        // 标记已响应
        async function markResponded(leadId) {
            if (!confirm('确认已与该客户取得联系，并将其标记为已响应？')) return;

            try {
                const res = await fetch(`${API_BASE}/api/leads/${leadId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Token': adminToken
                    },
                    body: JSON.stringify({ status: 'responded' })
                });

                if (res.ok) {
                    const lead = allGuestLeads.find(l => l.id === leadId);
                    if (lead) {
                        lead.status = 'responded';
                        lead.responded_at = new Date().toISOString();
                    }

                    // 清除 URL 上的高亮参数，避免刷新一直高亮
                    if (window.history.replaceState) {
                        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                        window.history.replaceState({ path: newUrl }, '', newUrl);
                    }

                    renderGuestLeads();
                } else {
                    const data = await res.json();
                    alert(data.detail || '标记失败');
                }
            } catch(e) {
                alert('网络异常，请稍后重试');
            }
        }

        // 导出 Excel
        function exportTableToCSV(tableId, filename) {
            let table = document.getElementById(tableId);
            if (!table) return;
            let rows = table.querySelectorAll('tr');
            if (rows.length <= 1) { alert("暂无数据可导出"); return; }

            let csvContent = "\uFEFF";
            rows.forEach(row => {
                let cols = row.querySelectorAll('td, th');
                let rowData = [];
                cols.forEach(col => { rowData.push('"' + col.innerText.replace(/"/g, '""') + '"'); });
                csvContent += rowData.join(",") + "\n";
            });

            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            let url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename + "_" + new Date().getTime() + ".csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function fetchResources() {
            const tbody = document.getElementById('resourcesTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4">加载中...</td></tr>';
            try {
                const response = await fetch(`${API_BASE}/api/resources`);
                const data = await response.json();
                tbody.innerHTML = data.resources.length === 0 ? '<tr><td colspan="6" class="py-12 text-center text-gray-400">暂无内容</td></tr>' :
                    data.resources.map(res => `<tr class="hover:bg-gray-50 transition"><td class="py-3 px-4 text-center"><img src="${res.img || 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05'}" class="w-12 h-8 object-cover rounded mx-auto"></td><td class="py-4 px-4 text-xs"><span class="bg-gray-100 px-2 py-1 rounded">${res.category || '未分类'}</span></td><td class="py-4 px-4 font-bold text-gray-800">${res.title}</td><td class="py-4 px-4 text-brand font-bold">¥ ${res.price || '-'}</td><td class="py-4 px-6 text-right space-x-2"><button onclick='editResource(${JSON.stringify(res).replace(/'/g, "&#39;")})' class="text-xs bg-gray-100 text-gray-700 hover:bg-gray-200 py-1 px-3 rounded">编辑</button><button onclick="deleteResourceAdmin(${res.id}, '${res.title}')" class="text-xs bg-red-50 text-red-600 hover:bg-red-500 hover:text-white py-1 px-3 rounded">删除</button></td></tr>`).join('');
            } catch (error) { tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-red-500">加载失败</td></tr>'; }
        }

        async function fetchEvents() {
            const tbody = document.getElementById('eventsTableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4">加载中...</td></tr>';
            try {
                const res = await fetch(`${API_BASE}/api/events`);
                const events = await res.json();
                tbody.innerHTML = events.length === 0 ? '<tr><td colspan="4" class="py-12 text-center text-gray-400">暂无会议</td></tr>' :
                    events.map(e => `<tr class="hover:bg-gray-50 transition"><td class="py-4 px-6 text-gray-500 text-sm">${e.date_str}</td><td class="py-4 px-6 font-bold text-gray-800">${e.title}</td><td class="py-4 px-6 text-gray-600 text-sm">${e.location}</td><td class="py-4 px-6 text-right space-x-2"><button onclick='editEvent(${JSON.stringify(e).replace(/'/g, "&#39;")})' class="text-xs bg-gray-100 text-gray-700 hover:bg-gray-200 py-1 px-3 rounded">编辑</button><button onclick="deleteEventAdmin(${e.id}, '${e.title}')" class="text-xs bg-red-50 text-red-600 hover:bg-red-500 hover:text-white py-1 px-3 rounded">删除</button></td></tr>`).join('');
            } catch (e) { tbody.innerHTML = '<tr><td colspan="4" class="py-12 text-center text-red-500">加载失败</td></tr>'; }
        }

        function openEventModal() {
            document.getElementById('eventEditId').value = '';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventLocation').value = '';
            document.getElementById('eventSummary').value = '';
            quill.root.innerHTML = '';
            document.getElementById('eventMediaLinks').value = '';
            currentEventImagesArray = [];
            renderEventImages();
            document.getElementById('eventModalTitle').innerText = "发布会议";
            document.getElementById('eventModal').classList.remove('hidden'); document.getElementById('eventModal').classList.add('flex');
        }

        function editEvent(e) {
            document.getElementById('eventEditId').value = e.id;
            document.getElementById('eventTitle').value = e.title || '';
            document.getElementById('eventDate').value = e.date_str || '';
            document.getElementById('eventLocation').value = e.location || '';
            document.getElementById('eventSummary').value = e.summary || '';
            quill.root.innerHTML = e.content || '';
            document.getElementById('eventMediaLinks').value = e.media_links || '';
            currentEventImagesArray = (e.images || '').split(',').map(u => u.trim()).filter(u => u);
            renderEventImages();
            document.getElementById('eventModalTitle').innerText = "编辑会议";
            document.getElementById('eventModal').classList.remove('hidden'); document.getElementById('eventModal').classList.add('flex');
        }

        function closeEventModal() { document.getElementById('eventModal').classList.add('hidden'); document.getElementById('eventModal').classList.remove('flex'); }

        async function saveEvent() {
            const id = document.getElementById('eventEditId').value;
            const contentHTML = quill.root.innerHTML;
            const data = {
                title: document.getElementById('eventTitle').value,
                date_str: document.getElementById('eventDate').value,
                location: document.getElementById('eventLocation').value,
                summary: document.getElementById('eventSummary').value,
                content: contentHTML === '<p><br></p>' ? '' : contentHTML,
                images: currentEventImagesArray.join(','),
                media_links: document.getElementById('eventMediaLinks').value
            };
            if(!data.title || !data.date_str) { alert("标题和日期不能为空"); return; }
            const url = id ? `${API_BASE}/api/events/${id}` : `${API_BASE}/api/events`;
            try {
                const res = await fetch(url, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                if(res.ok) { closeEventModal(); fetchEvents(); } else { alert("保存失败"); }
            } catch(e) { alert("网络错误"); }
        }

        async function deleteEventAdmin(id, title) {
            if (!confirm(`确定删除会议【${title}】吗？`)) return;
            try {
                const res = await fetch(`${API_BASE}/api/events/${id}`, { method: 'DELETE' });
                if (res.ok) fetchEvents();
            } catch (e) { alert("网络错误"); }
        }

        async function handleEventImgsUpload(input) {
            const files = input.files;
            if (!files || files.length === 0) return;
            const statusEl = document.getElementById('eventImgsUploadStatus');
            statusEl.innerText = `正在上传...`;
            for (let i = 0; i < files.length; i++) {
                try {
                    const url = await uploadFileToR2(files[i]);
                    currentEventImagesArray.push(url);
                } catch (error) { alert("部分图片上传失败，请检查云端 BEEIMG_TOKEN 配置"); break; }
            }
            input.value = '';
            statusEl.innerText = `上传完成`;
            setTimeout(() => statusEl.innerText = '', 3000);
            renderEventImages();
        }

        function renderEventImages() {
            const container = document.getElementById('eventImagesPreview');
            if (currentEventImagesArray.length === 0) {
                container.innerHTML = '<div class="col-span-4 text-center text-xs text-gray-400 py-4 border-2 border-dashed rounded-lg">暂无配图</div>';
                return;
            }
            container.innerHTML = currentEventImagesArray.map((url, index) => `
                <div class="relative group rounded-lg overflow-hidden border border-gray-200 bg-white">
                    <img src="${url}" class="w-full h-20 object-cover">
                    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-1">
                        ${index > 0 ? `<button type="button" onclick="moveEventImage(${index}, -1)" class="w-6 h-6 bg-white/20 hover:bg-white text-black rounded flex items-center justify-center text-xs">&lt;</button>` : '<div class="w-6"></div>'}
                        <button type="button" onclick="removeEventImage(${index})" class="w-6 h-6 bg-red-500 hover:bg-red-600 text-white rounded flex items-center justify-center text-xs">×</button>
                        ${index < currentEventImagesArray.length - 1 ? `<button type="button" onclick="moveEventImage(${index}, 1)" class="w-6 h-6 bg-white/20 hover:bg-white text-black rounded flex items-center justify-center text-xs">&gt;</button>` : '<div class="w-6"></div>'}
                    </div>
                </div>
            `).join('');
        }
        function moveEventImage(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= currentEventImagesArray.length) return;
            const temp = currentEventImagesArray[index];
            currentEventImagesArray[index] = currentEventImagesArray[newIndex];
            currentEventImagesArray[newIndex] = temp;
            renderEventImages();
        }
        function removeEventImage(index) { currentEventImagesArray.splice(index, 1); renderEventImages(); }

        function openResModal() {
            document.getElementById('resEditId').value = '';
            document.getElementById('resEditCategory').value = '文化';
            document.getElementById('resEditTag').value = '';
            document.getElementById('resEditTitle').value = '';
            document.getElementById('resEditDuration').value = '';
            document.getElementById('resEditPrice').value = '';
            document.getElementById('resEditDesc').value = '';
            document.getElementById('resEditKeywords').value = '';
            document.getElementById('resEditImg').value = '';
            document.getElementById('resImgPreview').classList.add('hidden');
            document.getElementById('resImgFileName').innerText = '未选择文件';
            document.getElementById('resModalTitle').innerText = "发布生态内容";
            document.getElementById('resModal').classList.remove('hidden'); document.getElementById('resModal').classList.add('flex');
        }

        function editResource(res) {
            document.getElementById('resEditId').value = res.id;
            document.getElementById('resEditCategory').value = res.category || '文化';
            document.getElementById('resEditTag').value = res.tag || '';
            document.getElementById('resEditTitle').value = res.title || '';
            document.getElementById('resEditDuration').value = res.duration || '';
            document.getElementById('resEditPrice').value = res.price || '';
            document.getElementById('resEditDesc').value = res.desc || '';
            document.getElementById('resEditKeywords').value = res.keywords || '';
            const imgUrl = res.img || '';
            document.getElementById('resEditImg').value = imgUrl;
            if (imgUrl) {
                document.getElementById('resImgPreview').src = imgUrl;
                document.getElementById('resImgPreview').classList.remove('hidden');
                document.getElementById('resImgFileName').innerText = '已上传旧图';
            } else {
                document.getElementById('resImgPreview').classList.add('hidden');
                document.getElementById('resImgFileName').innerText = '未选择文件';
            }
            document.getElementById('resModalTitle').innerText = "编辑生态内容";
            document.getElementById('resModal').classList.remove('hidden'); document.getElementById('resModal').classList.add('flex');
        }

        function closeResModal() { document.getElementById('resModal').classList.add('hidden'); document.getElementById('resModal').classList.remove('flex'); }

        async function saveResource() {
            const id = document.getElementById('resEditId').value;
            const data = {
                category: document.getElementById('resEditCategory').value,
                tag: document.getElementById('resEditTag').value,
                title: document.getElementById('resEditTitle').value,
                duration: document.getElementById('resEditDuration').value,
                price: parseFloat(document.getElementById('resEditPrice').value) || 0,
                desc: document.getElementById('resEditDesc').value,
                keywords: document.getElementById('resEditKeywords').value,
                img: document.getElementById('resEditImg').value
            };
            if(!data.title || !data.img) { alert("标题和封面图不能为空"); return; }
            const url = id ? `${API_BASE}/api/resources/${id}` : `${API_BASE}/api/resources`;
            try {
                const res = await fetch(url, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                if(res.ok) { closeResModal(); fetchResources(); } else { alert("保存失败"); }
            } catch(e) { alert("网络错误"); }
        }

        async function deleteResourceAdmin(id, title) {
            if (!confirm(`确定删除【${title}】吗？`)) return;
            try { const res = await fetch(`${API_BASE}/api/resources/${id}`, { method: 'DELETE' }); if (res.ok) fetchResources(); } catch (e) { alert("网络错误"); }
        }

        async function uploadFileToR2(file) {
            const formData = new FormData(); formData.append('file', file);
            const response = await fetch(`${API_BASE}/api/admin/upload`, { method: 'POST', body: formData });
            if (!response.ok) { const err = await response.json(); throw new Error(err.detail || '上传失败'); }
            const data = await response.json(); return data.url;
        }

        async function handleResImgUpload(input) {
            const file = input.files[0]; if (!file) return;
            const fileNameEl = document.getElementById('resImgFileName'); const previewEl = document.getElementById('resImgPreview');
            fileNameEl.innerText = '正在上传...'; previewEl.src = URL.createObjectURL(file); previewEl.classList.remove('hidden');
            try {
                const publicUrl = await uploadFileToR2(file);
                document.getElementById('resEditImg').value = publicUrl;
                fileNameEl.innerText = '✅ 上传成功'; fileNameEl.className = 'text-sm text-green-600 truncate flex-1';
            } catch (error) {
                alert('图片上传失败：' + error.message);
                fileNameEl.innerText = '上传失败'; fileNameEl.className = 'text-sm text-red-600 truncate flex-1';
            }
        }
    </script>
</body>
